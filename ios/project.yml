name: RitmUp
options:
  bundleIdPrefix: ru.ritmup
  deploymentTarget:
    iOS: "17.0"
settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  RitmUp:
    type: application
    platform: iOS
    sources:
      - path: RitmUp
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ru.ritmup.app
        PRODUCT_NAME: RitmUp
        INFOPLIST_FILE: RitmUp/Info.plist
        CODE_SIGN_ENTITLEMENTS: RitmUp/RitmUp.entitlements
        TARGETED_DEVICE_FAMILY: "1"
    scheme:
      testTargets: []
